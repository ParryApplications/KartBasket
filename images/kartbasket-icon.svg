<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Shopping cart/basket icon for KartBasket -->
  <defs>
    <style>
      .icon-primary { fill: #4CAF50; }
      .icon-secondary { fill: #2E7D32; }
      .icon-accent { fill: #FF6B6B; }
    </style>
  </defs>
  
  <!-- Basket body -->
  <path class="icon-primary" d="M 20 35 L 30 75 Q 30 80 35 80 L 65 80 Q 70 80 70 75 L 80 35 Z"/>
  
  <!-- Basket weave pattern -->
  <line x1="25" y1="45" x2="75" y2="45" stroke="#2E7D32" stroke-width="1.5" opacity="0.3"/>
  <line x1="27" y1="55" x2="73" y2="55" stroke="#2E7D32" stroke-width="1.5" opacity="0.3"/>
  <line x1="29" y1="65" x2="71" y2="65" stroke="#2E7D32" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Cart wheels -->
  <circle class="icon-secondary" cx="35" cy="85" r="5"/>
  <circle class="icon-secondary" cx="65" cy="85" r="5"/>
  <circle fill="white" cx="35" cy="85" r="2"/>
  <circle fill="white" cx="65" cy="85" r="2"/>
  
  <!-- Handle/rim -->
  <path class="icon-secondary" d="M 20 35 Q 20 32 23 32 L 77 32 Q 80 32 80 35" fill="none" stroke="#2E7D32" stroke-width="3"/>
  
  <!-- Letter K badge -->
  <circle class="icon-accent" cx="50" cy="50" r="12"/>
  <text x="50" y="57" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">K</text>
</svg>
